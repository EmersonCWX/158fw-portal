<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - 158th Fighter Wing</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body {
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .reset-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            background: #1e1e1e url('assets/Backend pics/20260516122409_1.jpg') center center / cover fixed;
        }
        .reset-page::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.65);
            z-index: 0;
        }
        .reset-card {
            position: relative;
            z-index: 1;
            background: #1f2226;
            border: 1px solid #3a3f45;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 40px rgba(0,0,0,0.8);
        }
        .reset-card-header {
            background: #2a2d32;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #3a3f45;
        }
        .reset-card-header img {
            height: 28px;
            width: 28px;
            object-fit: contain;
        }
        .reset-card-title {
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #fff;
            text-transform: uppercase;
        }
        .reset-card-body {
            padding: 28px 28px 24px;
        }
        .reset-subtitle {
            color: #888;
            font-size: 0.8rem;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 24px;
        }
        .reset-form .form-group {
            margin-bottom: 18px;
        }
        .reset-form label {
            display: block;
            color: #ccc;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1px;
            text-transform: uppercase;
            margin-bottom: 6px;
        }
        .reset-form input[type="password"] {
            width: 100%;
            background: #12151a;
            border: 1px solid #3a3f45;
            color: #fff;
            padding: 10px 14px;
            font-size: 0.95rem;
            font-family: inherit;
            outline: none;
            transition: border-color 0.2s;
            box-sizing: border-box;
        }
        .reset-form input[type="password"]:focus {
            border-color: #ffffff;
        }
        .reset-form input[type="password"]::placeholder {
            color: #555;
        }
        .reset-submit-btn {
            width: 100%;
            background: #ffffff;
            color: #1a1d22;
            border: none;
            padding: 12px;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s ease;
            margin-top: 24px;
        }
        .reset-submit-btn:hover:not(:disabled) {
            background: #2d5016;
            color: #fff;
        }
        .reset-submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .reset-message {
            margin-top: 12px;
            font-size: 0.8rem;
            text-align: center;
            display: none;
            padding: 8px 12px;
        }
        .reset-message.error {
            color: #ff4d4d;
            background: rgba(255,77,77,0.1);
            border: 1px solid rgba(255,77,77,0.3);
        }
        .reset-message.success {
            color: #6dbf67;
            background: rgba(109,191,103,0.1);
            border: 1px solid rgba(109,191,103,0.3);
        }
        .reset-back-link {
            display: block;
            text-align: center;
            margin-top: 1.2rem;
            color: #7a9ec9;
            font-size: 0.78rem;
            text-decoration: none;
            letter-spacing: 0.5px;
        }
        .reset-back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="reset-page">
        <div class="reset-card">
            <div class="reset-card-header">
                <img src="assets/vang-logo.png.png" alt="VA ANG Logo">
                <span class="reset-card-title">Reset Password</span>
            </div>
            <div class="reset-card-body">
                <p class="reset-subtitle">Virtual 158th Fighter Wing</p>

                <div id="resetFormWrapper">
                    <form class="reset-form" id="resetPasswordForm" autocomplete="off">
                        <div class="form-group">
                            <label for="newPassword">NEW PASSWORD</label>
                            <input type="password" id="newPassword" placeholder="Enter new password" required autocomplete="new-password">
                        </div>
                        <div class="form-group">
                            <label for="confirmPassword">CONFIRM PASSWORD</label>
                            <input type="password" id="confirmPassword" placeholder="Confirm new password" required autocomplete="new-password">
                        </div>
                        <button type="submit" class="reset-submit-btn" id="setPasswordBtn">RESET PASSWORD</button>
                    </form>
                    <p class="reset-message" id="resetMessage"></p>
                </div>

                <a href="index.html" class="reset-back-link">Back to Home</a>
            </div>
        </div>
    </div>

    <script>
        const SUPABASE_URL = 'https://gcumgpfyfqtfwbskkngt.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImdjdW1ncGZ5ZnF0Zndic2trbmd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI4MDczMTAsImV4cCI6MjA4ODM4MzMxMH0.OSY0XEPQp-WsFWuiGrUG5fcLIVMI3c8AxBEv2shFftg';

        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: {
                persistSession: true,
                autoRefreshToken: true,
                detectSessionInUrl: true,
                storageKey: 'v158fw-auth'
            }
        });

        const resetPasswordForm = document.getElementById('resetPasswordForm');
        const setPasswordBtn = document.getElementById('setPasswordBtn');
        const resetMessage = document.getElementById('resetMessage');

        function showMessage(text, type) {
            resetMessage.textContent = text;
            resetMessage.className = 'reset-message ' + type;
            resetMessage.style.display = 'block';
        }

        // Supabase handles the token from the URL hash automatically via detectSessionInUrl.
        // Wait for the session to be ready before accepting input.
        _supabase.auth.onAuthStateChange((event, session) => {
            if (event === 'PASSWORD_RECOVERY') {
                // Session is ready — user can now set a new password
                resetPasswordForm.style.display = '';
            }
        });

        resetPasswordForm.addEventListener('submit', async (e) => {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword.length < 8) {
                showMessage('Password must be at least 8 characters.', 'error');
                return;
            }
            if (newPassword !== confirmPassword) {
                showMessage('Passwords do not match.', 'error');
                return;
            }

            setPasswordBtn.disabled = true;
            setPasswordBtn.textContent = 'SAVING...';

            const { error } = await _supabase.auth.updateUser({ password: newPassword });

            setPasswordBtn.disabled = false;
            setPasswordBtn.textContent = 'SET PASSWORD';

            if (error) {
                showMessage(error.message, 'error');
            } else {
                showMessage('Password updated successfully! Redirecting to home...', 'success');
                resetPasswordForm.style.display = 'none';
                setTimeout(() => { window.location.href = 'index.html'; }, 2500);
            }
        });
    </script>
</body>
</html>
